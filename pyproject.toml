[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illustrator-mcp"
dynamic = ["version"]
description = "MCP server for controlling Adobe Illustrator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Keda Jin", email = "jkd-2012@live.com"}
]
keywords = ["mcp", "adobe", "illustrator", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # mcp 1.x exposes mcp.server.fastmcp.FastMCP; mcp 2.x renamed it to
    # mcp.server.mcpserver.MCPServer. illustrator_mcp.compat supports both,
    # so allow the whole 1.x/2.x range (2.0.0 is the current latest).
    "mcp>=1.9.0,<3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
geometry = [
    "pyclipper>=1.3.0",
]

[project.scripts]
illustrator-mcp = "illustrator_mcp.server:main"
illustrator-mcp-doctor = "illustrator_mcp.doctor:main"
illustrator-mcp-antigravity = "illustrator_mcp.antigravity:main"

[tool.setuptools.packages.find]
include = ["illustrator_mcp", "illustrator_mcp.*"]

[tool.setuptools.dynamic]
version = {attr = "illustrator_mcp.__version__.__version__"}

[tool.hatch.build.targets.wheel]
packages = ["illustrator_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=illustrator_mcp --cov-report=html --cov-report=term"
markers = [
    "integration: marks tests as integration tests (requires Illustrator)",
]
